description: distill_A

target:
  service: sing
  name: GenAI-Shared-UKSouth2
  workspace_name: Singularity-GenAI-WS-UKSouth2

environment:
  image: pytorch/pytorch:2.3.1-cuda12.1-cudnn8-devel
  setup:
    - set -x
    - sudo apt update -y
    - sudo apt install -y bc
    - export PATH=/home/aiscuser/.local/bin:$$PATH
    - pip install numpy>=1.20 click>=8.0 pillow>=8.3.1 scipy>=1.7.1 psutil requests imageio huggingface_hub
    - pip install wandb webdataset seaborn s3fs diffusers imageio-ffmpeg>=0.4.3 pyspng importlib_metadata
    - pip install -U "huggingface_hub[cli]"

storage:
  output:
    storage_account_name: vigstandard
    container_name: data
    mount_dir: /blob

code:
  local_dir: ./

jobs:
  - name: distill_A|ffhq_gaussian
    sku: 1x80G8-A100-IB-NvLink
    process_count_per_node: 1
    sla_tier: Premium
    priority: high
    mpi: False
    command:
#      - export HUGGINGFACE_HUB_CACHE="/blob/v-tianyuchen/datasets/.cache"
#      - sleep 3000
#      - huggingface-cli download yasiz/vision_data
      - bash A_run_bash/train_sid_cluster.sh